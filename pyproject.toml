[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "athena-bbb"
version = "0.1.0rc5"
description = "Chemical scaffold-separated BBB classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Renato Socodato"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.4,<2", "rdkit>=2024.3", "joblib>=1.3,<2", "pillow>=13"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
athena-bbb = "athena_bbb.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
